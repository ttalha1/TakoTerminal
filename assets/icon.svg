<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="iconBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="iconNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="iconLaser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0" />
      <stop offset="30%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="iconPaper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dış Kalkan -->
  <rect width="512" height="512" rx="128" fill="url(#iconBg)" />
  <rect width="500" height="500" x="6" y="6" rx="122" fill="none" stroke="url(#iconNeon)" stroke-width="8" stroke-opacity="0.4" />

  <!-- Üst Belge -->
  <g transform="translate(0, 15)">
    <rect x="196" y="70" width="120" height="70" rx="8" fill="#475569" opacity="0.6" transform="rotate(-6 256 105)" />
    <rect x="180" y="75" width="152" height="95" rx="10" fill="url(#iconPaper)" />
    <line x1="202" y1="95" x2="260" y2="95" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <line x1="202" y1="110" x2="310" y2="110" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
    <line x1="202" y1="125" x2="280" y2="125" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Yazıcı Üst Yuvası -->
  <g transform="translate(0, 15)">
    <rect x="126" y="160" width="260" height="44" rx="14" fill="#1e293b" stroke="#334155" stroke-width="4" />
    <rect x="166" y="177" width="180" height="10" rx="5" fill="#020617" />
    <rect x="150" y="180" width="212" height="4" fill="url(#iconLaser)" filter="url(#iconGlow)" />
  </g>

  <!-- TAKO Kafası -->
  <g transform="translate(0, 30)">
    <path d="M 170 215 C 170 165, 342 165, 342 215 C 342 255, 314 272, 256 272 C 198 272, 170 255, 170 215 Z" fill="url(#iconNeon)" />
    <rect x="190" y="202" width="132" height="38" rx="19" fill="#020617" stroke="#38bdf8" stroke-width="3" />
    <circle cx="228" cy="221" r="8" fill="#38bdf8" filter="url(#iconGlow)" />
    <circle cx="284" cy="221" r="8" fill="#38bdf8" filter="url(#iconGlow)" />
    <circle cx="230" cy="219" r="3" fill="#ffffff" />
    <circle cx="286" cy="219" r="3" fill="#ffffff" />
  </g>

  <!-- Dokunaçlar -->
  <g transform="translate(0, 15)">
    <path d="M 180 265 C 135 275, 95 310, 105 355 C 115 390, 160 380, 178 345 C 190 325, 170 295, 200 280" fill="none" stroke="url(#iconNeon)" stroke-width="20" stroke-linecap="round" />
    <path d="M 332 265 C 377 275, 417 310, 407 355 C 397 390, 352 380, 334 345 C 322 325, 342 295, 312 280" fill="none" stroke="url(#iconNeon)" stroke-width="20" stroke-linecap="round" />
  </g>

  <!-- Alt Çıkan Belge -->
  <g transform="translate(0, 40)">
    <rect x="146" y="325" width="220" height="22" rx="8" fill="#1e293b" stroke="#334155" stroke-width="3" />
    <rect x="166" y="300" width="180" height="90" rx="10" fill="url(#iconPaper)" />
    <g transform="translate(188, 320)">
      <rect x="0" y="0" width="26" height="26" rx="4" fill="#0f172a" />
      <rect x="5" y="5" width="16" height="16" rx="2" fill="#ffffff" />
      <rect x="9" y="9" width="8" height="8" fill="#0f172a" />
      <line x1="38" y1="8" x2="120" y2="8" stroke="#475569" stroke-width="4" stroke-linecap="round" />
      <line x1="38" y1="18" x2="110" y2="18" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
      <line x1="0" y1="40" x2="135" y2="40" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
      <line x1="0" y1="52" x2="90" y2="52" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
    </g>
  </g>
</svg>
