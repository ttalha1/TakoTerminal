<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="tGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Arka Plan Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Arka Kopya Karti (Yari Saydam) -->
  <rect x="88" y="72" width="272" height="272" rx="64" fill="#ffffff" fill-opacity="0.18" />

  <!-- On Ana Kart (Koyu Kontrast) -->
  <rect x="136" y="120" width="288" height="296" rx="72" fill="#0f172a" filter="url(#dropShadow)" />

  <!-- T Harfi (Ust Cubuk ve Govde) -->
  <g fill="url(#tGrad)">
    <rect x="188" y="180" width="184" height="52" rx="20" />
    <rect x="252" y="180" width="56" height="184" rx="20" />
  </g>
</svg>